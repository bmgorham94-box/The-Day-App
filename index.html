<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#191817" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="The Day" />
  <meta name="description" content="The Day — a personal daily planner. Now and next, at a glance." />
  <title>The Day</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-180.png" />
  <link rel="icon" href="icons/icon-192.png" />

  <!-- Fonts are self-hosted in fonts/ (declared in styles.css) — no network fonts,
       correct typography offline on first paint. Sans-serif only, never serif. -->
  <link rel="preload" href="fonts/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar">
      <div class="topbar-row">
        <h1 class="wordmark">The&nbsp;Day</h1>
        <div class="badges" id="badges"><!-- phase + check-in chips --></div>
      </div>
      <div class="weekstrip" id="weekstrip" role="tablist" aria-label="Week"></div>
    </header>

    <main id="main">
      <!-- Focus card -->
      <section class="focus" id="focus" aria-live="polite"></section>

      <!-- Banners (TBD phase, check-in) -->
      <div id="banners"></div>

      <!-- Day spine -->
      <section class="spine" id="spine" aria-label="Day timeline"></section>

      <!-- Panels below the spine -->
      <section class="panels" id="panels"></section>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Views">
      <button data-view="today" class="tab is-active" aria-current="page">Today</button>
      <button data-view="wod" class="tab">WOD</button>
      <button data-view="fuel" class="tab">Fuel</button>
      <button data-view="progress" class="tab">Progress</button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
