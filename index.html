<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <meta name="theme-color" content="#ECE7DD" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#141A16" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="The Day" />
  <meta name="description" content="The Day — a personal daily planner. Now and next, at a glance." />
  <title>The Day</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-180.png" />
  <link rel="icon" href="icons/icon-192.png" />

  <!-- Fonts: load from Google, fall back to system sans-serif offline. Never serif. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar">
      <div class="topbar-row">
        <h1 class="wordmark">The&nbsp;Day</h1>
        <div class="badges" id="badges"><!-- phase + check-in chips --></div>
      </div>
      <div class="weekstrip" id="weekstrip" role="tablist" aria-label="Week"></div>
    </header>

    <main id="main">
      <!-- Focus card -->
      <section class="focus" id="focus" aria-live="polite"></section>

      <!-- Banners (TBD phase, check-in) -->
      <div id="banners"></div>

      <!-- Day spine -->
      <section class="spine" id="spine" aria-label="Day timeline"></section>

      <!-- Panels below the spine -->
      <section class="panels" id="panels"></section>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Views">
      <button data-view="today" class="tab is-active" aria-current="page">Today</button>
      <button data-view="adherence" class="tab">Adherence</button>
      <button data-view="targets" class="tab">Targets</button>
      <button data-view="settings" class="tab">Settings</button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
